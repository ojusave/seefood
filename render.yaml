previews:
  generation: off

services:
  - type: web
    name: seefood-py-web
    runtime: node
    plan: starter
    region: oregon
    repo: https://github.com/ojusave/seefood
    branch: python
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: RENDER_API_KEY
        sync: false
      - key: TASK_ID
        value: seefood-py/seeFood
      - key: NEXT_PUBLIC_GITHUB_REPO
        value: https://github.com/ojusave/seefood

  - type: workflow
    name: seefood-py
    runtime: python
    region: oregon
    repo: https://github.com/ojusave/seefood
    branch: python
    rootDir: workflow-py
    buildCommand: pip install -r requirements.txt && python fetch_model.py
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: TYPESAFE_API_KEY
        sync: false
