previews:
  generation: off

services:
  - type: web
    name: seefood
    runtime: node
    plan: starter
    region: oregon
    repo: https://github.com/ojusave/seefood
    branch: main
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: RENDER_API_KEY
        sync: false
      - key: TS_TASK_ID
        value: seefood-ts/seeFood
      - key: PY_TASK_ID
        value: seefood-py/seeFood
      - key: NEXT_PUBLIC_GITHUB_REPO
        value: https://github.com/ojusave/seefood

  - type: workflow
    name: seefood-ts
    runtime: node
    region: oregon
    repo: https://github.com/ojusave/seefood
    branch: main
    rootDir: workflow-ts
    buildCommand: npm ci && npm run fetch-model && npm run build
    startCommand: node dist/main.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TYPESAFE_API_KEY
        sync: false

  - type: workflow
    name: seefood-py
    runtime: python
    region: oregon
    repo: https://github.com/ojusave/seefood
    branch: main
    rootDir: workflow-py
    buildCommand: pip install -r requirements.txt && python fetch_model.py
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: TYPESAFE_API_KEY
        sync: false
