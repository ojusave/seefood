previews:
  generation: off

services:
  - type: web
    name: seefood
    runtime: node
    plan: starter
    region: oregon
    repo: https://github.com/ojusave/seefood
    branch: main
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: RENDER_API_KEY
        sync: false
      - key: TASK_ID
        value: seefood-ts/seeFood
      - key: NEXT_PUBLIC_GITHUB_REPO
        value: https://github.com/ojusave/seefood

  - type: workflow
    name: seefood-ts
    runtime: node
    region: oregon
    repo: https://github.com/ojusave/seefood
    branch: main
    rootDir: workflow-ts
    buildCommand: npm ci && npm run fetch-model && npm run build
    startCommand: node dist/main.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TYPESAFE_API_KEY
        sync: false
